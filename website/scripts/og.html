<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0c0709;color:#f2eaec;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(50% 60% at 15% 20%,rgba(249,115,22,.32),transparent 70%),radial-gradient(45% 55% at 90% 80%,rgba(217,70,239,.26),transparent 70%),radial-gradient(35% 45% at 60% 100%,rgba(244,63,94,.18),transparent 70%)}

h1{font:700 80px/1.02 'Space Grotesk';letter-spacing:-.03em;margin-top:36px}
h1 span{background:linear-gradient(100deg,#fdba74,#fb7185 45%,#e879f9);-webkit-background-clip:text;color:transparent}
p{font-size:28px;color:#bfaeb6;margin-top:26px}
.tags{display:flex;gap:12px;margin-top:34px}
.tags b{font:500 20px 'JetBrains Mono';padding:8px 16px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.05);color:#fecdd3}
