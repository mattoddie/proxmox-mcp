name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Test
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"
      - name: Check docs/tools.md is up to date
        run: make docs-check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: proxmox-mcp:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e PROXMOX_URL=https://192.0.2.1:8006 -e PROXMOX_API_TOKEN='ci@pam!ci=ci' -e MCP_AUTH_TOKEN=ci \
            proxmox-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break; sleep 1; done
          echo
          tools=$(curl -fsS -X POST http://localhost:8080/mcp \
            -H 'Authorization: Bearer ci' -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | jq '.result.tools | length')
          echo "Tools registered: $tools"
          test "$tools" -gt 0
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/mcp -d '{}')
          test "$code" = 401
          test "$(docker run --rm proxmox-mcp:ci version)" = 0.0.0-ci
          sleep 6
          test "$(docker inspect --format '{{.State.Health.Status}}' smoke)" = healthy
          docker logs smoke
          docker rm -f smoke
          # The http transport must refuse to start without MCP_AUTH_TOKEN.
          if docker run --rm -e PROXMOX_URL=https://192.0.2.1:8006 -e PROXMOX_API_TOKEN='ci@pam!ci=ci' proxmox-mcp:ci; then
            echo "Started without MCP_AUTH_TOKEN"; exit 1
          fi

      - name: Build all platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
