version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    groups:
      website:
        patterns: ["*"]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The image tracks Node.js LTS (even majors). Odd majors are short-lived "Current"
    # releases that reach end of life after about six months, so don't propose them.
    ignore:
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x", "31.x"]
    labels: [dependencies]
