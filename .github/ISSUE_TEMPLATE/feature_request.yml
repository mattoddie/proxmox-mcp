name: ✨ Feature request
description: Suggest a new tool or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you'd like to ask your assistant to do, or what's missing today.
      placeholder: e.g. "I'd like to manage PCI passthrough mappings so I can attach a GPU to a VM without opening the UI."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: New tool(s), arguments or behaviour. If you know the API endpoint (from the Proxmox API viewer or your browser's dev tools), include it. It helps a lot.
  - type: input
    id: pve-version
    attributes:
      label: Proxmox VE version
      placeholder: e.g. 9.0
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this
