# Copy example.env to .env and fill it in, then: docker compose up -d
# The http transport needs MCP_AUTH_TOKEN in .env (generate one with: openssl rand -hex 32).
# With an https:// PROXMOX_URL, .env must also say how to check the Proxmox certificate:
# PROXMOX_TLS_FINGERPRINT (recommended), PROXMOX_CA_FILE, or PROXMOX_VERIFY_SSL=true/false.
services:
  proxmox-mcp:
    image: ghcr.io/mattoddie/proxmox-mcp:latest
    # To build from source instead of pulling, replace the line above with:
    # build: .
    container_name: proxmox-mcp
    restart: unless-stopped
    env_file: .env
    ports:
      # Published on every interface of the host; use "127.0.0.1:8080:8080" when only local
      # clients (or a reverse proxy on the same host) connect.
      - "8080:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
